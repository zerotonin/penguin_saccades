# ─────────────────────────────────────────────────────────────────
#  Release: gate on tests, build sdist + wheel, publish a Release
#  Triggered by pushing a version tag (v*.*.*).  Zenodo mints the DOI.
# ─────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build
      - name: Test gate
        run: pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
